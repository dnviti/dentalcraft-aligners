[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# kept in sync by release-please (extra-files, jsonpath $.workspace.package.version)
version = "0.2.0-alpha.10"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-Proprietary"
repository = "https://github.com/dnviti-personal-org/dentalcraft-aligners"
authors = ["Daniele Viti"]
publish = false

[workspace.dependencies]
# internal crates
dca-model = { path = "crates/dca-model" }
dca-algo = { path = "crates/dca-algo" }
dca-module = { path = "crates/dca-module" }

# dentalcraft-core crates
dc-case = { git = "https://github.com/dnviti-personal-org/dentalcraft-core.git", tag = "v0.3.0-alpha.7" }
dc-command = { git = "https://github.com/dnviti-personal-org/dentalcraft-core.git", tag = "v0.3.0-alpha.7" }
dc-geom = { git = "https://github.com/dnviti-personal-org/dentalcraft-core.git", tag = "v0.3.0-alpha.7" }
dc-i18n = { git = "https://github.com/dnviti-personal-org/dentalcraft-core.git", tag = "v0.3.0-alpha.7" }
dc-jobs = { git = "https://github.com/dnviti-personal-org/dentalcraft-core.git", tag = "v0.3.0-alpha.7" }
dc-mesh = { git = "https://github.com/dnviti-personal-org/dentalcraft-core.git", tag = "v0.3.0-alpha.7" }
dc-module-api = { git = "https://github.com/dnviti-personal-org/dentalcraft-core.git", tag = "v0.3.0-alpha.7" }
dc-raster = { git = "https://github.com/dnviti-personal-org/dentalcraft-core.git", tag = "v0.3.0-alpha.7" }
dc-scene = { git = "https://github.com/dnviti-personal-org/dentalcraft-core.git", tag = "v0.3.0-alpha.7" }

# GUI: must be the same egui version as dentalcraft-core
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }

glam = { version = "0.34.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"  # JSON Schema of command parameters (same version as dentalcraft-core)
thiserror = "2.0.21"
nalgebra = "0.35.0"  # SVD / eigen solves (same version as dentalcraft-core)
rayon = "1.12.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# `cargo kani` (docs/kani.md): kiddo (dc-geom) depends on generator, whose
# global asm Kani cannot model; no proof harness reaches it.
[workspace.metadata.kani]
flags = { ignore-global-asm = true }
unstable = { unstable-options = true }
